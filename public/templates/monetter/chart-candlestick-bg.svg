<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="chartGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="#07090e" />
  
  <!-- Subtle Grid Lines (Trading Terminal style) -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4">
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
    <line x1="120" y1="0" x2="120" y2="600" />
    <line x1="240" y1="0" x2="240" y2="600" />
    <line x1="360" y1="0" x2="360" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
  </g>

  <!-- Bottom Glow Gradient -->
  <rect x="0" y="250" width="600" height="350" fill="url(#chartGlow)" />

  <!-- Candlesticks - Left Group (Ascending trend) -->
  <g filter="url(#glow)" opacity="0.85">
    <!-- Candle 1 -->
    <line x1="22" y1="480" x2="22" y2="580" stroke="#f59e0b" stroke-width="2" opacity="0.5" />
    <rect x="15" y="500" width="14" height="60" rx="2" fill="#d97706" opacity="0.6" />

    <!-- Candle 2 -->
    <line x1="44" y1="450" x2="44" y2="560" stroke="#f97316" stroke-width="2" opacity="0.6" />
    <rect x="37" y="470" width="14" height="65" rx="2" fill="#ea580c" opacity="0.7" />

    <!-- Candle 3 -->
    <line x1="66" y1="410" x2="66" y2="530" stroke="#ff6b00" stroke-width="2" opacity="0.75" />
    <rect x="59" y="430" width="14" height="75" rx="2" fill="#f97316" opacity="0.8" />

    <!-- Candle 4 -->
    <line x1="88" y1="370" x2="88" y2="490" stroke="#ff8800" stroke-width="2" opacity="0.85" />
    <rect x="81" y="390" width="14" height="75" rx="2" fill="#ff6b00" opacity="0.9" />

    <!-- Candle 5 -->
    <line x1="110" y1="340" x2="110" y2="450" stroke="#ffa133" stroke-width="2" opacity="0.7" />
    <rect x="103" y="360" width="14" height="60" rx="2" fill="#ff8800" opacity="0.75" />
  </g>

  <!-- Candlesticks - Right Group (Ascending Bullish Breakout) -->
  <g filter="url(#glow)" opacity="0.9">
    <!-- Candle 6 -->
    <line x1="488" y1="440" x2="488" y2="540" stroke="#f59e0b" stroke-width="2" opacity="0.5" />
    <rect x="481" y="460" width="14" height="60" rx="2" fill="#d97706" opacity="0.6" />

    <!-- Candle 7 -->
    <line x1="510" y1="390" x2="510" y2="510" stroke="#f97316" stroke-width="2" opacity="0.65" />
    <rect x="503" y="415" width="14" height="70" rx="2" fill="#ea580c" opacity="0.75" />

    <!-- Candle 8 -->
    <line x1="532" y1="340" x2="532" y2="470" stroke="#ff6b00" stroke-width="2" opacity="0.8" />
    <rect x="525" y="365" width="14" height="80" rx="2" fill="#f97316" opacity="0.85" />

    <!-- Candle 9 -->
    <line x1="554" y1="290" x2="554" y2="430" stroke="#ff8800" stroke-width="2" opacity="0.9" />
    <rect x="547" y="315" width="14" height="90" rx="2" fill="#ff6b00" opacity="0.95" />

    <!-- Candle 10 -->
    <line x1="576" y1="250" x2="576" y2="390" stroke="#ffa133" stroke-width="2" opacity="0.95" />
    <rect x="569" y="275" width="14" height="90" rx="2" fill="#ffaa33" opacity="1" />
  </g>

  <!-- Glowing bottom curved neon arc -->
  <path d="M 0 580 Q 300 520 600 580" fill="none" stroke="#ff6b00" stroke-width="4" opacity="0.9" filter="url(#glow)" />
  <path d="M 0 580 Q 300 520 600 580" fill="none" stroke="#ffe066" stroke-width="1.5" opacity="0.8" />
</svg>
